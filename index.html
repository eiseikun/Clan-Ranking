<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アチャ伝2 攻略ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

<style>
  :root{
    --bg:#0a0c12;
    --bg-panel:#12151f;
    --bg-panel2:#181c29;
    --bg-panel3:#1f2432;
    --border:#262c3d;
    --border-soft:#1b2030;
    --gold:#d4af37;
    --gold-soft:#e8cf7a;
    --gold-dark:#a07800;
    --banner-bright:#2f8fd4;
    --banner-mid:#1f6fae;
    --banner-dark:#123a5e;
    --cyan:#45c4b0;
    --text:#e9e7e0;
    --text-dim:#8b92a6;
    --text-faint:#5a6178;
    --up:#4fbf6a;
    --down:#e0555a;
  }
  *{box-sizing:border-box;}
  #at-root{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(47,143,212,0.16), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
    -webkit-font-smoothing:antialiased;
  }
  .at-wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  .at-header{position:relative;padding:26px 0 16px;text-align:center;}
  .at-eyebrow{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.28em;
    color:var(--gold-soft);text-transform:uppercase;opacity:.85;margin-bottom:6px;
  }
  .at-banner{position:relative;display:inline-block;padding:10px 34px;margin-top:2px;}
  .at-banner::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, var(--banner-bright), var(--banner-mid) 70%, var(--banner-dark));
    clip-path:polygon(3% 0%, 97% 0%, 100% 30%, 96% 50%, 100% 70%, 97% 100%, 3% 100%, 0% 68%, 4% 50%, 0% 32%);
    box-shadow:0 8px 24px -8px rgba(47,143,212,.6);
  }
  .at-title{
    position:relative;font-family:'Shippori Mincho',serif;font-weight:800;
    font-size:24px;letter-spacing:.06em;color:#fdf6e3;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    white-space:nowrap;
  }
  .at-sub{margin-top:10px;font-size:11px;color:var(--text-faint);letter-spacing:.14em;font-family:'Cinzel',serif;}

  .at-gear{
    position:fixed;top:14px;right:14px;z-index:200;
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,15,.85);border:1px solid var(--border);cursor:pointer;font-size:17px;
    backdrop-filter:blur(8px);
  }
  .at-gear:hover{border-color:var(--gold-dark);box-shadow:0 0 12px rgba(212,175,55,.25);}
  .at-info-btn{
    position:fixed;top:14px;right:60px;z-index:200;
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,15,.85);border:1px solid var(--border);cursor:pointer;font-size:17px;
    backdrop-filter:blur(8px);
  }
  .at-info-btn:hover{border-color:var(--gold-soft);box-shadow:0 0 12px rgba(232,207,122,.25);}
  .at-preset-btn{
    position:fixed;top:14px;right:106px;z-index:200;
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,15,.85);border:1px solid var(--border);cursor:pointer;font-size:17px;
    backdrop-filter:blur(8px);
  }
  .at-preset-btn:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(69,196,176,.25);}

  .at-tabs{display:flex;gap:6px;margin:18px 0 16px;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:5px;}
  .at-tab{
    flex:1;text-align:center;padding:11px 4px;border-radius:8px;font-size:13px;font-weight:700;
    color:var(--text-dim);cursor:pointer;user-select:none;letter-spacing:.02em;transition:all .15s;
  }
  .at-tab.active{background:linear-gradient(180deg,#2a2033,var(--bg-panel3));color:var(--gold-soft);box-shadow:inset 0 0 0 1px rgba(212,175,55,.35);}
  .at-tab .soon{display:block;font-size:9.5px;color:var(--text-faint);margin-top:2px;font-weight:600;letter-spacing:.04em;}

  .at-panel{background:var(--bg-panel);border:2px solid #3a4568;border-radius:14px;padding:18px 16px;margin-bottom:18px;box-shadow:0 8px 22px -14px rgba(0,0,0,.65);}
  .at-panel-title{font-family:'Shippori Mincho',serif;font-weight:800;font-size:15px;color:var(--gold-soft);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:8px;}
  .at-panel-desc{font-size:11.5px;color:var(--text-faint);line-height:1.6;margin-bottom:14px;}
  .at-subbox{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-left:3px solid rgba(212,175,55,.26);border-radius:10px;padding:12px;margin-bottom:14px;}
  .at-subbox .at-subbox{background:rgba(255,255,255,0.045);border-left:3px solid rgba(212,175,55,.42);border-radius:8px;}
  .at-subbox-title{font-size:12.5px;font-weight:700;color:var(--gold-soft);margin-bottom:8px;display:flex;align-items:center;gap:6px;}

  .at-field{margin-bottom:12px;}
  .at-label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.03em;}
  .at-hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;line-height:1.5;}
  .at-caveat{font-size:10.5px;color:var(--text-faint);margin-top:8px;line-height:1.5;font-style:italic;}
  .at-input, .at-select{
    width:100%;background:var(--bg-panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:13.5px;font-family:'Noto Sans JP',sans-serif;
  }
  .at-input:focus, .at-select:focus{outline:none;border-color:var(--gold);}
  .at-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .at-checkrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-panel2);
    margin-bottom:8px;cursor:pointer;
  }
  .at-checkrow:last-child{margin-bottom:0;}
  .at-checkrow.on{border-color:var(--cyan);background:rgba(69,196,176,.08);}
  .at-checkrow-main{flex:1;}
  .at-checkrow-label{font-size:13px;font-weight:600;color:var(--text);}
  .at-checkrow-sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .at-checkrow-badge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--cyan);white-space:nowrap;}
  .at-switch{
    position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;background:var(--bg-panel3);
    border:1px solid var(--border);
  }
  .at-switch::after{
    content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:var(--text-faint);transition:.15s;
  }
  .at-checkrow.on .at-switch{border-color:var(--cyan);background:rgba(69,196,176,.25);}
  .at-checkrow.on .at-switch::after{left:18px;background:var(--cyan);}

  .at-stepper{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
  .at-stepper-btn{
    width:28px;height:28px;border-radius:8px;background:var(--bg-panel3);border:1px solid var(--border);
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
    cursor:pointer;user-select:none;
  }
  .at-stepper-btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .at-stepper-val{
    min-width:30px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    color:var(--text);
  }

  .at-statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:4px;}
  .at-statgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .at-statgrid4 .at-statbox{padding:10px 4px;}
  .at-statgrid4 .at-statbox-label{font-size:9.5px;}
  .at-statgrid4 .at-statbox-val{font-size:14px;}
  .at-statbox{background:var(--bg-panel2);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;}
  .at-statbox-label{font-size:10.5px;color:var(--text-faint);letter-spacing:.03em;margin-bottom:6px;text-transform:uppercase;}
  .at-statbox-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--gold-soft);}
  .at-statbox-val.cyan{color:var(--cyan);}
  .at-statbox-pair{border-color:rgba(69,196,176,.3);}

  .at-btn{
    background:linear-gradient(180deg,#2a3244,var(--bg-panel3));border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em;
  }
  .at-btn:hover{border-color:var(--gold);}
  .at-btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241d05;border:none;}
  .at-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .at-btn-danger{background:transparent;border:1px solid #7a3030;color:#e08a8a;}
  .at-btn-sm{padding:6px 10px;font-size:11.5px;border-radius:7px;}
  .at-btn-full{width:100%;}

  .at-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
  .at-compare-card{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--bg-panel2);text-align:center;}
  .at-compare-card.win{border-color:var(--gold);background:rgba(212,175,55,.1);box-shadow:0 0 0 1px rgba(212,175,55,.25) inset;}
  .at-compare-name{font-size:12px;color:var(--text-dim);font-weight:700;margin-bottom:6px;}
  .at-compare-gain{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--text);}
  .at-compare-gain.win{color:var(--gold-soft);}
  .at-compare-sub{font-size:10.5px;color:var(--text-faint);margin-top:6px;line-height:1.5;}
  .at-crown{font-size:11px;color:var(--gold-soft);margin-top:6px;font-weight:700;letter-spacing:.03em;}

  .at-note{font-size:11px;color:var(--text-faint);line-height:1.8;margin-top:10px;padding:10px 12px;background:var(--bg-panel2);border-radius:8px;border:1px solid var(--border-soft);}

  .at-empty{text-align:center;color:var(--text-faint);font-size:13px;padding:50px 12px;line-height:2;}
  .at-empty-icon{font-size:30px;margin-bottom:10px;opacity:.7;}

  .at-modal-backdrop{position:fixed;inset:0;background:rgba(5,6,10,.72);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
  .at-modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:18px;}
  @media (min-width:560px){
    .at-modal-backdrop{align-items:center;padding:20px;}
    .at-modal{border-radius:16px;max-height:82vh;}
  }
  .at-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .at-modal-title{font-family:'Shippori Mincho',serif;font-weight:800;font-size:16px;color:var(--gold-soft);}
  .at-modal-close{cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;padding:4px;}

  .at-tierrow{display:grid;grid-template-columns:1fr 84px 30px;gap:6px;align-items:center;margin-bottom:6px;}
  .at-tierrow input{padding:8px 9px;font-size:12.5px;}
  .at-tierrow .at-input{width:100%;}
  .at-tier-del{cursor:pointer;color:var(--text-faint);text-align:center;font-size:16px;}
  .at-tier-del:hover{color:var(--down);}
  .at-percent-suffix{position:relative;}

  .at-tierrow4{display:grid;grid-template-columns:1fr 70px 62px 30px;gap:6px;align-items:center;margin-bottom:6px;}
  .at-tierrow4 input{padding:8px 8px;font-size:12px;}
  .at-tierrow4 .at-input{width:100%;}

  .at-modebtns{display:flex;gap:6px;margin-bottom:12px;}
  .at-modebtn{flex:1;text-align:center;padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--text-dim);cursor:pointer;user-select:none;border:1px solid var(--border);background:var(--bg-panel2);}
  .at-modebtn.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(212,175,55,.1);}

  .at-group-tag{display:inline-block;font-size:9.5px;color:var(--cyan);background:rgba(69,196,176,.12);border:1px solid rgba(69,196,176,.3);
    border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700;letter-spacing:.02em;}

  .at-toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-panel3);
    border:1px solid var(--gold);color:var(--gold-soft);padding:10px 18px;border-radius:999px;font-size:12.5px;
    font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:400;white-space:nowrap;
  }

  .at-divider{height:1px;background:var(--border-soft);margin:16px 0;}
  .at-footer-note{font-size:10.5px;color:var(--text-faint);line-height:1.9;text-align:center;margin-top:6px;}

  @media (max-width:400px){
    .at-title{font-size:19px;}
    .at-statgrid{grid-template-columns:1fr 1fr 1fr;gap:6px;}
    .at-statbox-val{font-size:15px;}
    .at-compare{grid-template-columns:1fr;}
    .at-statgrid4{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="at-root"><div class="at-wrap" id="at-app"></div></div>

<script>
  // メインスクリプト(下の非moduleスクリプト)から使うためのプレースホルダー。
  // 下のtype="module"スクリプトが読み込み完了した時点でready Promiseが解決し、
  // loadPresets / savePresets の実装が差し込まれる。
  window.AT2Cloud = {
    ready: new Promise(function(resolve){ window.__at2CloudResolve = resolve; })
  };
</script>
<script type="module">
  // ---------- Firebase (Firestore) クラウド同期 ----------
  // プリセットを「同期コード」単位でFirestoreに保存し、コードを他の端末で入力すると
  // 同じプリセットを読み込めるようにする（アカウント登録なしの簡易クラウド保存）。
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzbAnlP-XRNZe210GEYvEVFskayxjX9UI",
    authDomain: "clan-ranking-661e3.firebaseapp.com",
    projectId: "clan-ranking-661e3",
    storageBucket: "clan-ranking-661e3.firebasestorage.app",
    messagingSenderId: "790320652461",
    appId: "1:790320652461:web:9d5f01428aa9de57bba624",
    measurementId: "G-SPNBH7FEPK"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const COLLECTION = 'at2PresetSync';

  async function loadPresetsFromCloud(code){
    const ref = doc(db, COLLECTION, code);
    const snap = await getDoc(ref);
    if(!snap.exists()) return null;
    const data = snap.data();
    return Array.isArray(data && data.presets) ? data.presets : null;
  }
  async function savePresetsToCloud(code, presets){
    const ref = doc(db, COLLECTION, code);
    await setDoc(ref, { presets: presets, updatedAt: serverTimestamp() });
  }

  window.AT2Cloud.loadPresets = loadPresetsFromCloud;
  window.AT2Cloud.savePresets = savePresetsToCloud;
  window.__at2CloudResolve();
</script>

<script>
(function(){
  // ---------- storage helpers ----------
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return JSON.parse(JSON.stringify(fallback));
      const parsed = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(fallback)), parsed);
    }catch(e){ return JSON.parse(JSON.stringify(fallback)); }
  }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  // ---------- default data ----------
  // 鋭利の矢・アローレイン: なし/レジェンド(+15%)/ミシック(+30%)。値は固定（設定画面での変更対象外）。
  const SHARP_RAIN_TIERS = [
    {id:'none', name:'なし', pct:0},
    {id:'legend', name:'レジェンド', pct:15},
    {id:'mythic', name:'ミシック', pct:30},
  ];
  // 虚無の刃（聖物）: なし(未所持)+0%、無凸+12%、1凸+18%、2凸+24%、以降10凸まで+6%ずつ。値は固定。
  const VOID_TIERS = (function(){
    const tiers = [{id:'none', name:'なし', pct:0}];
    for(let i=0;i<=10;i++){
      tiers.push({id:'v'+i, name: i===0?'無凸':(i+'凸'), pct: 12 + i*6});
    }
    return tiers;
  })();

  // 攻撃力up系スキル：スキル名・倍率(%)は設定画面で自由に編集・追加・削除できる。
  function defaultAtkSkills(){
    return [
      {id:uid(), name:'グレート品質 攻撃力up', pct:10, locked:true},
      {id:uid(), name:'エピック品質 攻撃力up', pct:25, locked:true},
      {id:uid(), name:'巨大化', pct:20, locked:true},
      {id:uid(), name:'レジェンド品質 攻撃力up', pct:30, locked:true},
    ];
  }
  // 取得スキル「その他」：自由に追加・削除・命名できるスキル。
  // 同じグループ(group)同士は%を足し算、違うグループ同士は掛け算で最終ダメージ量に反映する。
  function defaultOtherSkills(){
    return [];
  }

  const DEFAULT_BASE_ATK_SPEED = 1.651;
  const DEFAULT_SETTINGS = {
    baseAtkSpeed: DEFAULT_BASE_ATK_SPEED,
    atkSkills: defaultAtkSkills(),
    otherSkills: defaultOtherSkills()
  };

  // 端末のブラウザに以前保存された古い設定(localStorage)が残っていても、
  // グレート/エピック/巨大化/レジェンドなどの「固定(locked)」スキルは常に
  // コード側の最新の数値に同期させる（ユーザーが自由に追加した非固定スキルはそのまま維持）。
  function reconcileAtkSkills(savedAtkSkills){
    const saved = Array.isArray(savedAtkSkills) ? savedAtkSkills : [];
    const savedLockedByName = {};
    saved.forEach(function(s){ if(s && s.locked) savedLockedByName[s.name] = s; });
    const freshLocked = defaultAtkSkills().map(function(defSkill){
      const existing = savedLockedByName[defSkill.name];
      // id はそのまま引き継ぐ（取得回数の紐付けを維持するため）。pct・name・locked は常に最新化。
      return existing
        ? {id: existing.id, name: defSkill.name, pct: defSkill.pct, locked: true}
        : defSkill;
    });
    const customSkills = saved.filter(function(s){ return s && !s.locked; });
    return freshLocked.concat(customSkills);
  }
  const OTHER_DMG_CATS = [
    {key:'otherAir', label:'空中の敵'},
    {key:'otherGround', label:'地上の敵'},
    {key:'otherTrash', label:'雑魚敵'},
    {key:'otherElite', label:'エリート'},
    {key:'otherBoss', label:'ボス'},
  ];

  const DEFAULT_BUILD = {
    atkInputMode:'split', // split: 攻撃力+攻撃力ボーナスを入力 / direct: 総攻撃力を直接入力
    atkBase:0, atkBonusPct:0, totalAtkDirect:0, finalDmgBonusPct:0,
    otherAirOn:false, otherAirPct:0,
    otherGroundOn:false, otherGroundPct:0,
    otherTrashOn:false, otherTrashPct:0,
    otherEliteOn:false, otherElitePct:0,
    otherBossOn:false, otherBossPct:0,
    symphony:false,
    armor:'other', // oracle_myth | oracle_low | dragoon | griffon | other
    diagonalCount:0, frontCount:0, rearCount:0, tracking:false,
    sharpTierId:'none', rainTierId:'none', voidTierId:'none',
    sharpRuneQuality:'none', // none | epic | legend
    painRing:false, ero:false, multishot:false,
    atkSpeedBonusPct:0, critRatePct:0, critDmgMultPct:0,
    simSeconds:null, // null＝未入力時はデフォルト（1回の攻撃分＝1/実攻撃速度秒）を使用
    spiritIntimidation:false, spiritRecovery:false, spiritMelee:false, spiritCount:0,
    atkSkillCounts:{},
    otherSkillCounts:{},
    compareCandA:'diagonal', compareCandB:'none'
  };

  const TOOLS = [
    {id:'arrows', label:'スキル選択', icon:'🏹'},
    {id:'fishing', label:'未定', icon:'🎣', comingSoon:true},
  ];

  let settings = loadJSON('at2_settings_v3', DEFAULT_SETTINGS);
  settings.atkSkills = reconcileAtkSkills(settings.atkSkills);
  if(!(Number(settings.baseAtkSpeed) > 0)) settings.baseAtkSpeed = DEFAULT_BASE_ATK_SPEED;
  saveJSON('at2_settings_v3', settings);
  let build = loadJSON('at2_build_v3', DEFAULT_BUILD);
  let state = {
    tab: localStorage.getItem('at2_tab_v1') || 'arrows',
    settingsOpen:false,
    infoOpen:false,
    presetOpen:false,
    presetEditIdx:null,
    presetActionIdx:null,
    presetRenameIdx:null,
    simDetailOpen:false,
  };
  let toastMsg = null, toastTimer = null;

  const PRESET_SLOT_MIN = 3;
  const PRESET_SLOT_MAX = 12;
  const PRESET_FIELDS = [
    'atkInputMode','atkBase','atkBonusPct','totalAtkDirect','finalDmgBonusPct',
    'atkSpeedBonusPct','critRatePct','critDmgMultPct',
    'symphony','armor',
    'spiritIntimidation','spiritRecovery','spiritMelee',
    'sharpTierId','sharpRuneQuality','rainTierId','voidTierId',
    'painRing',
    'otherAirOn','otherAirPct','otherGroundOn','otherGroundPct','otherTrashOn','otherTrashPct',
    'otherEliteOn','otherElitePct','otherBossOn','otherBossPct'
  ];
  function loadPresets(){
    try{
      const raw = localStorage.getItem('at2_presets_v1');
      let p = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(p)) p = [];
      p = p.slice(0, PRESET_SLOT_MAX);
      while(p.length < PRESET_SLOT_MIN) p.push(null);
      return p;
    }catch(e){
      return new Array(PRESET_SLOT_MIN).fill(null);
    }
  }
  // ---------- cloud sync (Firebase Firestore) ----------
  // コード入力なしで、常に同じ1つの共有ドキュメントを読み書きする。
  // → どの端末・ブラウザで開いても自動的に同じプリセットが表示・共有される。
  const SHARED_PRESET_DOC = 'shared';
  let cloudBusy = false;
  let cloudStatus = 'idle'; // idle | ok | error
  let cloudPushTimer = null;

  // クラウドから取得したデータをプリセット配列として安全な形に整える
  function sanitizePresetsArray(arr){
    let p = Array.isArray(arr) ? arr.slice(0, PRESET_SLOT_MAX) : [];
    p = p.map(function(item){
      if(item && typeof item==='object' && typeof item.name==='string' && item.data && typeof item.data==='object'){
        return {name:item.name, data:item.data};
      }
      return null;
    });
    while(p.length < PRESET_SLOT_MIN) p.push(null);
    return p;
  }
  // 共有ドキュメントの最新プリセットを取得してこのブラウザに反映。
  // クラウド側にまだ何も無い場合は、今のプリセットをそのままクラウドへ保存する。
  function cloudPull(){
    if(!window.AT2Cloud || !window.AT2Cloud.ready){ cloudStatus = 'error'; return; }
    cloudBusy = true; render();
    window.AT2Cloud.ready.then(function(){
      return window.AT2Cloud.loadPresets(SHARED_PRESET_DOC);
    }).then(function(remote){
      if(remote){
        presets = sanitizePresetsArray(remote);
        saveJSON('at2_presets_v1', presets); // ローカルにもキャッシュ（cloudPushは呼ばない）
        cloudStatus = 'ok';
      } else {
        return window.AT2Cloud.savePresets(SHARED_PRESET_DOC, presets).then(function(){
          cloudStatus = 'ok';
        });
      }
    }).catch(function(){
      cloudStatus = 'error';
    }).finally(function(){
      cloudBusy = false; render();
    });
  }
  // ローカルの変更をデバウンスしてクラウドへ自動反映
  function cloudPush(){
    if(!window.AT2Cloud || !window.AT2Cloud.ready) return;
    clearTimeout(cloudPushTimer);
    cloudBusy = true;
    cloudPushTimer = setTimeout(function(){
      window.AT2Cloud.ready.then(function(){
        return window.AT2Cloud.savePresets(SHARED_PRESET_DOC, presets);
      }).then(function(){
        cloudStatus = 'ok';
      }).catch(function(){
        cloudStatus = 'error';
      }).finally(function(){
        cloudBusy = false; render();
      });
    }, 500);
  }

  function savePresets(){ saveJSON('at2_presets_v1', presets); cloudPush(); }
  function snapshotPresetData(b){
    const d = {};
    PRESET_FIELDS.forEach(function(k){ d[k] = b[k]; });
    return d;
  }
  function applyPresetData(b, d){
    // プリセットごとに📚基本情報📚の内容を完全に独立させるため、
    // そのプリセットのデータに項目が無い場合は「未設定」の初期値に戻す
    // （古い形式で保存されたプリセットを開いた際に、直前のプリセットの値が
    // 　残ってしまう＝別プリセット同士の内容が混ざる問題を防ぐため）。
    PRESET_FIELDS.forEach(function(k){
      b[k] = Object.prototype.hasOwnProperty.call(d,k) ? d[k] : DEFAULT_BUILD[k];
    });
  }

  let presets = loadPresets();
  // 起動時に必ずクラウドの最新プリセットを取得する（コード入力不要・全端末共通）
  setTimeout(function(){ cloudPull(); }, 30);

  function saveSettings(){ saveJSON('at2_settings_v3', settings); }
  function saveBuild(){ saveJSON('at2_build_v3', build); }
  function setTab(id){ state.tab = id; localStorage.setItem('at2_tab_v1', id); render(); }


  function showToast(msg){
    toastMsg = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ toastMsg=null; render(); }, 1800);
  }

  // ---------- arrow-count calculation ----------
  function armorBonus(armor){
    if(armor==='oracle_myth') return 4;
    if(armor==='oracle_low') return 2;
    return 0; // dragoon / griffon / other
  }
  function armorLabel(armor){
    return {
      oracle_myth:'神託の鎧（ミシック以上）',
      oracle_low:'神託の鎧（ミシック未満）',
      other:'その他の鎧・未装備',
    }[armor] || 'その他の鎧・未装備';
  }
  function findTier(itemKey, tierId){
    const tiers = itemKey==='sharp' || itemKey==='rain' ? SHARP_RAIN_TIERS : VOID_TIERS;
    return tiers.find(t=>t.id===tierId);
  }
  function findTierPct(itemKey, tierId){
    const t = findTier(itemKey, tierId);
    return t ? (Number(t.pct)||0) : 0;
  }
  // 矢の本数（本来の値）：シンフォニー・鎧ボーナス・ダイアゴナル/フロント/リアアローすべてを含む
  function rawArrows(b){
    let n = 1;
    if(b.symphony) n += 2;
    n += armorBonus(b.armor);
    n += (Number(b.diagonalCount)||0) * 2;
    n += (Number(b.frontCount)||0) * 1;
    n += (Number(b.rearCount)||0) * 1;
    return n;
  }
  // 矢の本数（最終ダメージ計算用）：エロージョンフィールド取得時は、シンフォニー・鎧ボーナス・
  // ダイアゴナル/フロント/リアアローによる矢数増加をすべて計算から除外し、基礎の1本のみとする
  // （エロージョンフィールド取得時は矢数を含む計算方法が異なるため、二重計上を避ける）。
  function calcArrows(b){
    return b.ero ? 1 : rawArrows(b);
  }
  function spiritSynergyBonus(b){
    if(!b.spiritIntimidation) return 0;
    const cnt = (b.spiritRecovery?1:0) + (b.spiritMelee?1:0);
    if(cnt===1) return 20;
    if(cnt===2) return 40;
    return 0;
  }
  // 攻撃力up(%)：精霊シナジー・精霊本数(威圧所持時のみ)・グレード/エピック/レジェンド品質攻撃力up・巨大化など
  // → 総攻撃力に掛け合わせる独立した倍率（基準100%）
  function calcAtkUpMult(b){
    let m = 100;
    m += spiritSynergyBonus(b);
    if(b.spiritIntimidation){
      m += (Number(b.spiritCount)||0) * 10;
    }
    const counts = b.atkSkillCounts || {};
    settings.atkSkills.forEach(function(s){
      m += (Number(counts[s.id])||0) * (Number(s.pct)||0);
    });
    return m;
  }
  // 鋭利の矢ルーン品質：エピックで+10%、レジェンドで+20%
  function sharpRuneBonus(quality){
    if(quality==='epic') return 10;
    if(quality==='legend') return 20;
    return 0;
  }
  // 主武器アップ系スキル特殊補正：取得スキル「🗡️ 主武器ダメup」内の"-〇%"が付くスキル
  // （フロントアロー／追跡の目）を合計2つ以上取得している場合のみ、
  // 合計取得数×+1%が主武器ダメupに補正として加算される（1つ以下なら補正なし）。
  // ※ダイアゴナルアロー／リアアローは矢数のみの効果で%補正が無いため対象外。
  // 例：フロント単体-15%、追跡単体-10%＝-25%だが、2つ取得しているので+2%補正され-23%になる。
  function mainWeaponSkillCount(b){
    return (Number(b.frontCount)||0) + (b.tracking?1:0);
  }
  function mainWeaponSkillCorrection(b){
    const total = mainWeaponSkillCount(b);
    return total>=2 ? total : 0;
  }
  // エロージョンフィールド取得時に実際に適用される主武器アップ系スキル特殊補正（適用されない場合は0）
  function appliedMainWeaponSkillCorrection(b){
    return b.ero ? 0 : mainWeaponSkillCorrection(b);
  }
  // 主武器ダメup(%)：エンチャント(鋭利の矢・アローレイン)・鋭利の矢ルーン品質・虚無の刃・
  // ダイアゴナル/フロント/リアアロー・追跡の目・主武器アップ系スキル特殊補正 → 総攻撃力に掛け合わせる倍率（基準100%）
  // ※エロージョンフィールド取得時は、フロントアロー／追跡の目による矢数・主武器ダメup%への影響は
  // 　エロージョンフィールド取得時は矢数を含む計算方法が異なるため、ここでは適用しない（二重計上防止）。
  function calcMainDmgUpMultFull(b){
    let m = 100;
    m -= (Number(b.frontCount)||0) * 15;
    if(b.tracking) m -= 10;
    m += mainWeaponSkillCorrection(b);
    m += findTierPct('sharp', b.sharpTierId);
    m += findTierPct('rain', b.rainTierId);
    m += findTierPct('voidblade', b.voidTierId);
    m += sharpRuneBonus(b.sharpRuneQuality);
    return m;
  }
  // 主武器ダメup(%)：📖取得スキル由来のみ（フロントアロー・追跡の目・主武器アップ系スキル特殊補正）。
  // 鋭利の矢／アローレイン／虚無の刃／ルーン品質などの装備・エンチャント由来（📚基本情報📚）は含まない。
  // エロージョンフィールドの実質攻撃頻度は、装備由来の主武器ダメupを既に「会心なし基本攻撃力」側で
  // 反映しているため、ここでスキル由来のみを掛けることで二重計上を防ぐ。
  function calcMainDmgUpMultSkillOnly(b){
    let m = 100;
    m -= (Number(b.frontCount)||0) * 15;
    if(b.tracking) m -= 10;
    m += mainWeaponSkillCorrection(b);
    return m;
  }
  function calcMainDmgUpMult(b){
    if(b.ero){
      let m = 100;
      m += findTierPct('sharp', b.sharpTierId);
      m += findTierPct('rain', b.rainTierId);
      m += findTierPct('voidblade', b.voidTierId);
      m += sharpRuneBonus(b.sharpRuneQuality);
      return m;
    }
    return calcMainDmgUpMultFull(b);
  }
  // 実攻撃速度(発/秒) ＝ 基本攻撃速度(⚙️設定で編集可能。デフォルト1.651発/秒) ×（1 + 攻撃速度ボーナス/100）
  function getBaseAtkSpeed(){
    const v = Number(settings.baseAtkSpeed);
    return (v>0) ? v : DEFAULT_BASE_ATK_SPEED;
  }
  function actualAtkSpeed(b){
    return getBaseAtkSpeed() * (1 + (Number(b.atkSpeedBonusPct)||0)/100);
  }
  // 会心期待値 ＝ (1-会心率) + 会心率×会心ダメージ倍率　※会心ダメージ倍率は153%入力なら1.53として扱う
  // ※会心率は100%(=1)で頭打ち。100%を超えた入力分はダメージに影響しない。
  function critExpectation(b){
    const cr = Math.min((Number(b.critRatePct)||0) / 100, 1);
    const cd = (Number(b.critDmgMultPct)||0) / 100;
    return (1 - cr) + cr * cd;
  }
  // DPS(1秒当たりのダメージ) ＝ 総攻撃力 × 矢の本数 ×（攻撃力up÷100）×（主武器ダメup÷100）×（被ダメup÷100）×（〇〇敵ダメup÷100）×（その他÷100）×（最終ダメボーナス÷100）×（未会心率＋会心率×会心倍率）× 基本攻撃速度 × 攻撃速度upボーナス
  // ※基本攻撃速度×攻撃速度upボーナス ＝ actualAtkSpeed(build) と同一。
  // ※DPSは全弾ヒットを前提とした値。
  // ※エロージョンフィールド取得時のみ、下記の calcEroDPS() による専用の計算式に切り替わる。
  function calcDPSValue(r, b){
    if(b.ero) return calcEroDPS(r, b);
    return r.totalAtk * r.arrows * (r.atkUp/100) * (r.mainUp/100) * (r.dmgTakenUp/100) * (r.finalBonus/100) * (r.otherUp/100) * (r.otherSkillMult/100) * critExpectation(b) * actualAtkSpeed(b);
  }
  // ▼「会心なし基本攻撃力」「平均攻撃力」計算専用の共通関数：📚基本情報📚パネルに書かれている項目のみを
  // 　反映する簡易版の各倍率を使う（📖取得スキルパネル側の内容は含まない）。
  // 　※精霊シナジーボーナス（銘刻ルーン「精霊の威圧」＋回復精霊／近接精霊）はUI上は📚基本情報📚パネルに
  // 　　配置されているが、計算上は攻撃力up系スキルと同様の扱いのため、ここにも含めない。
  // 　※この2つは📊計算結果パネルの表示専用（取得スキルの影響を受けない値をあえて見せるための値）。
  // 　　エロージョンフィールドのDPS計算には calcEroBaseAtk/calcEroAvgAtk を使う（下記参照）。
  function calcNoCritBaseAtk(r, b){
    const baseAtkUp = calcBaseAtkUpMult(b);
    const baseMainUp = calcBaseMainDmgUpMult(b);
    const baseDmgTakenUp = calcBaseDmgTakenUpMult(b);
    const baseOtherMult = 100; // その他：📚基本情報📚には現状「その他」の項目がないため、基本何もなし（100%＝倍率1）として計算
    return r.totalAtk * (baseAtkUp/100) * (baseMainUp/100) * (baseDmgTakenUp/100) * (r.otherUp/100) * (baseOtherMult/100) * (r.finalBonus/100);
  }
  function calcAvgAtk(r, b){
    return calcNoCritBaseAtk(r, b) * critExpectation(b);
  }
  // 会心時攻撃力 ＝ 会心なし基本攻撃力 × 会心ダメージ倍率（会心が発生した場合の攻撃力）
  function calcCritAtk(r, b){
    const cd = (Number(b.critDmgMultPct)||0) / 100;
    return calcNoCritBaseAtk(r, b) * cd;
  }
  // ▼ エロージョンフィールドのDPS計算専用の攻撃力：📖取得スキルのうち「主武器up系」（フロントアロー・
  // 追跡の目・主武器アップ系スキル特殊補正・マルチショット）は実質攻撃頻度側に既に織り込まれているため
  // ここでは含めない。また「攻撃力up系スキル」（精霊シナジー・精霊本数・品質攻撃力up等）もエロの式の
  // 中には含めず、エロと攻撃力upは互いに独立した倍率として掛け合わせるため、ここでは攻撃力up＝100%
  // （基本情報のみ側に攻撃力up要素はない）として計算する
  // （攻撃力up系スキルによる倍率は calcEroDPS() 側で全体に対して外側から掛ける）。
  // 取得スキル「その他」はここに含める（実質攻撃頻度に含まれていないため）。
  function calcEroBaseAtk(r, b){
    const baseAtkUp = calcBaseAtkUpMult(b); // 常に100（攻撃力up系スキルは含めない＝エロと独立）
    const baseMainUp = calcBaseMainDmgUpMult(b); // 装備由来のみ（主武器up系スキルは実質攻撃頻度側で計算済み）
    const baseDmgTakenUp = calcBaseDmgTakenUpMult(b); // 苦痛の輪のみ（マルチショットは実質攻撃頻度側で計算済み）
    const otherSkillMult = r.otherSkillMult; // 取得スキル「その他」も反映
    return r.totalAtk * (baseAtkUp/100) * (baseMainUp/100) * (baseDmgTakenUp/100) * (r.otherUp/100) * (otherSkillMult/100) * (r.finalBonus/100);
  }
  function calcEroAvgAtk(r, b){
    return calcEroBaseAtk(r, b) * critExpectation(b);
  }
  // 範囲内被ダメ倍率：エロージョンフィールドの効果範囲内に敵がいる場合の被ダメ倍率（固定値）。
  const ERO_RANGE_DMG_MULT = 1.35;
  // エロージョンフィールド取得時の1秒あたりのダメージ ＝
  //  { 会心なし基本攻撃力(攻撃力up系スキルは含まず、取得スキル「その他」は含む) ×（未会心率＋会心率×会心倍率）
  //   × 実質攻撃頻度 × 基本攻撃速度 × 攻撃速度アップボーナス × 範囲内被ダメ倍率
  //   ＋ 総攻撃力 × 最終ダメボーナス × 0.5 × 範囲内被ダメ倍率 × 100/30 } × 攻撃力up(％)÷100
  // （第1項＝通常攻撃分。会心なし基本攻撃力×会心期待値＝平均攻撃力を使用。実質攻撃頻度は
  // 　attackFrequencyForEro() で計算（矢の本数・主武器up系スキル・マルチショットを含む）。
  // 　基本攻撃速度×攻撃速度アップボーナス＝actualAtkSpeed(build)と同一。
  // 　第2項＝フィールド自体のDoT分。範囲内被ダメ倍率は1.35固定。
  // 　攻撃力up系スキルはエロの式の中には含めず、エロ全体（第1項＋第2項の合計）に対して独立した
  // 　倍率として最後に掛け合わせる。＝エロ単体倍率×攻撃力up倍率が成立する。）
  function calcEroDPS(r, b){
    const avgAtk = calcEroAvgAtk(r, b);
    const freq = attackFrequencyForEro(b);
    const part1 = avgAtk * freq * actualAtkSpeed(b) * ERO_RANGE_DMG_MULT;
    const part2 = r.totalAtk * (r.finalBonus/100) * 0.5 * ERO_RANGE_DMG_MULT * (100/30);
    // 攻撃力up系スキルの倍率（エロと独立）：part1のbase攻撃力up分は常に100%（精霊シナジーを含む攻撃力up
    // 系スキルは一切織り込んでいない）ため、ここでは r.atkUp（精霊シナジー・精霊本数・品質攻撃力up等の
    // 攻撃力up系スキルを全反映したもの）÷100 の比率をpart1・part2両方にまとめて掛ける
    // （＝エロ単体倍率×攻撃力up倍率が成立する）。
    const baseAtkUp = calcBaseAtkUpMult(b);
    const atkUpSkillRatio = r.atkUp / baseAtkUp;
    return (part1 + part2) * atkUpSkillRatio;
  }
  // マルチショット倍率：エロージョンフィールドの実質攻撃頻度に掛け合わせる係数。
  // 取得している場合は×1.7、未取得の場合は×1（未適用）。
  function multishotMultiplier(b){
    return b.multishot ? 1.7 : 1;
  }
  // エロージョンフィールドの実質攻撃頻度 ＝ 矢の本数（本来の値。ダイアゴナル/フロント/リアアロー・
  // シンフォニー・鎧ボーナスを含む） × 主武器ダメup(📖取得スキル由来のみ・÷100。鋭利の矢／アローレイン／
  // 虚無の刃／ルーン品質などの装備由来は「会心なし基本攻撃力」側で反映済みのためここでは含まない)
  // × マルチショット倍率
  function attackFrequencyForEro(b){
    return rawArrows(b) * (calcMainDmgUpMultSkillOnly(b)/100) * multishotMultiplier(b);
  }
  // 被ダメup(%)：苦痛の輪(+20%)・マルチショット(×1.7。エロージョンフィールド取得時は実質攻撃頻度側に
  // 折り込まれるため、ここでは二重計上しない) → 総攻撃力に掛け合わせる倍率（基準100%）
  // ※エロージョンフィールド取得時の1秒あたりのダメージは、この「被ダメup」枠の倍率としてではなく、
  // 　calcEroDPS() で専用の式に基づいて別途直接計算される（詳しくは calcEroDPS のコメント参照）。
  function calcDmgTakenUpMult(b){
    let m = 100;
    if(b.painRing) m += 20;
    if(!b.ero){
      m += (multishotMultiplier(b) - 1) * 100;
    }
    return m;
  }
  // 最終ダメボーナス(%)：手入力の追加ボーナス → 基準100%の倍率
  function calcFinalDmgBonusMult(b){
    return 100 + (Number(b.finalDmgBonusPct)||0);
  }
  // 〇〇敵ダメup(%)：空中の敵・地上の敵・ザコ敵・エリート・ボスなど、ONにしたカテゴリの%を合算 → 基準100%の倍率
  function calcOtherDmgUpMult(b){
    let m = 100;
    OTHER_DMG_CATS.forEach(function(c){
      if(b[c.key+'On']) m += Number(b[c.key+'Pct'])||0;
    });
    return m;
  }
  // ▼「会心なし基本攻撃力」計算専用：📚基本情報📚パネルに書かれている項目のみを反映する簡易版の各倍率。
  // 　「取得スキル」パネルで取得する項目（品質攻撃力up・精霊本数・ダイアゴナル/フロント/リアアロー・
  // 　追跡の目・エロージョンフィールド・取得スキル「その他」など）は一切含めないため、
  // 　取得スキル側の取得状況を変えても会心なし基本攻撃力・平均攻撃力の値は変化しない。
  // 攻撃力up(基本情報のみ)：精霊シナジーボーナス（銘刻ルーン「精霊の威圧」＋回復精霊／近接精霊）は、
  // UI上は📚基本情報📚パネルに配置されているが、「初めから取れている取得スキル」という位置づけのため、
  // 計算上は📖取得スキル側の攻撃力upスキルと同様に扱い、ここ（基本情報のみの攻撃力up）には含めない
  // （精霊シナジーボーナスは calcAtkUpMult() 側の攻撃力up系スキルとしてのみ計算される）。
  function calcBaseAtkUpMult(b){
    return 100;
  }
  // 主武器ダメup(基本情報のみ)：エンチャント(鋭利の矢・アローレイン)・鋭利の矢ルーン品質・虚無の刃のみ
  // （フロントアロー／追跡の目／主武器アップ系スキル特殊補正は取得スキル側のため含まない）
  function calcBaseMainDmgUpMult(b){
    let m = 100;
    m += findTierPct('sharp', b.sharpTierId);
    m += findTierPct('rain', b.rainTierId);
    m += findTierPct('voidblade', b.voidTierId);
    m += sharpRuneBonus(b.sharpRuneQuality);
    return m;
  }
  // 被ダメup(基本情報のみ)：苦痛の輪のみ（エロージョンフィールドは取得スキル側のため含まない）
  function calcBaseDmgTakenUpMult(b){
    let m = 100;
    if(b.painRing) m += 20;
    return m;
  }
  // 総攻撃力 ＝ 攻撃力 ＋ { 攻撃力 × 攻撃力ボーナス ÷ 100 }（個別入力モード）
  // ／もしくは総攻撃力を直接入力（直接入力モード）
  function calcTotalAtk(b){
    const atkBase = Number(b.atkBase)||0;
    const atkBonusPct = Number(b.atkBonusPct)||0;
    const totalAtkDirect = Number(b.totalAtkDirect)||0;
    const totalAtk = (b.atkInputMode==='direct') ? totalAtkDirect : (atkBase + atkBase * (atkBonusPct/100));
    return {atkBase, atkBonusPct, totalAtkDirect, totalAtk};
  }
  // その他(取得スキル・自由編集)：同じグループは%を足し算、違うグループは掛け算で合成する倍率（基準100%）
  // 例）グループ「A」に+10%・+5%、グループ「B」に+20%がある場合
  //   → (100+10+5)/100 × (100+20)/100 × 100 として算出
  function calcOtherSkillMult(b){
    const counts = b.otherSkillCounts || {};
    const groups = {};
    (settings.otherSkills||[]).forEach(function(s){
      const cnt = Number(counts[s.id])||0;
      if(cnt===0) return;
      const g = (s.group && String(s.group).trim()) ? String(s.group).trim() : s.id;
      groups[g] = (groups[g]||0) + cnt * (Number(s.pct)||0);
    });
    let frac = 1;
    Object.keys(groups).forEach(function(g){
      frac *= (100 + groups[g]) / 100;
    });
    return frac * 100;
  }
  // 最終ダメージ量 ＝ 総攻撃力 × 矢の本数 × 攻撃力up(%) × 主武器ダメup(%) × 被ダメup(%) × 最終ダメボーナス(%) × 〇〇敵ダメup(%) × その他(%)
  function calcPower(b){
    const arrows = calcArrows(b);
    const rawArrowsVal = rawArrows(b);
    const atkInfo = calcTotalAtk(b);
    const atkUp = calcAtkUpMult(b);
    const mainUp = calcMainDmgUpMult(b);
    const dmgTakenUp = calcDmgTakenUpMult(b);
    const finalBonus = calcFinalDmgBonusMult(b);
    const otherUp = calcOtherDmgUpMult(b);
    const otherSkillMult = calcOtherSkillMult(b);
    const damage = atkInfo.totalAtk * arrows * (atkUp/100) * (mainUp/100) * (dmgTakenUp/100) * (finalBonus/100) * (otherUp/100) * (otherSkillMult/100);
    return Object.assign({arrows, rawArrows:rawArrowsVal, atkUp, mainUp, dmgTakenUp, finalBonus, otherUp, otherSkillMult, damage}, atkInfo);
  }
  // 「取得スキル」パネルの各項目（品質攻撃力up・精霊・ダイアゴナル/フロント/リアアロー・追跡の目・
  // エロージョンフィールド・その他）だけをすべて未取得の状態に戻したビルドを作る。
  // 「現在のビルド」パネルの装備・エンチャント等はそのまま維持するが、精霊シナジーボーナス
  // （銘刻ルーン「精霊の威圧」＋回復精霊／近接精霊）は配置こそ📚基本情報📚だが計算上は
  // 「初めから取れている取得スキル」扱いのため、ここでも未取得（オフ）に戻す。
  function calcNoAcquiredSkillsBuild(b){
    return Object.assign({}, b, {
      atkSkillCounts:{},
      otherSkillCounts:{},
      spiritCount:0,
      spiritIntimidation:false,
      spiritRecovery:false,
      spiritMelee:false,
      diagonalCount:0,
      frontCount:0,
      rearCount:0,
      tracking:false,
      ero:false,
      multishot:false
    });
  }
  // key は通常のbuildフィールド名、または動的スキル用の "atk:<id>" / "other:<id>" 形式。
  function getCount(key){
    if(key.indexOf('atk:')===0){
      const id = key.slice(4);
      return Number((build.atkSkillCounts||{})[id]) || 0;
    }
    if(key.indexOf('other:')===0){
      const id = key.slice(6);
      return Number((build.otherSkillCounts||{})[id]) || 0;
    }
    return Number(build[key]) || 0;
  }
  function setCount(key, newVal){
    if(key.indexOf('atk:')===0){
      const id = key.slice(4);
      if(!build.atkSkillCounts) build.atkSkillCounts = {};
      build.atkSkillCounts[id] = newVal;
    } else if(key.indexOf('other:')===0){
      const id = key.slice(6);
      if(!build.otherSkillCounts) build.otherSkillCounts = {};
      build.otherSkillCounts[id] = newVal;
    } else {
      build[key] = newVal;
    }
  }
  // ---------- candidate skill comparison ----------
  function getCandidateOptions(){
    const opts = [
      {id:'none', label:'なし（比較しない）', mode:'none'},
      {id:'diagonal', label:'ダイアゴナルアロー（矢+2本）', key:'diagonalCount', mode:'count'},
      {id:'front', label:'フロントアロー（矢+1本／主武器ダメup-15%）', key:'frontCount', mode:'count'},
      {id:'rear', label:'リアアロー（矢+1本）', key:'rearCount', mode:'count'},
      {id:'tracking', label:'追跡の目（主武器ダメup-10%・重複不可）', key:'tracking', mode:'toggle'},
      {id:'ero', label:'エロージョンフィールド（被ダメup 1.35×実質攻撃頻度+2.25÷(実攻撃速度×会心期待値)・重複不可）', key:'ero', mode:'toggle'},
      {id:'multishot', label:'マルチショット（被ダメup×1.7。エロージョンフィールド併用時は実質攻撃頻度に×1.7・重複不可）', key:'multishot', mode:'toggle'},
    ];
    if(build.spiritIntimidation){
      opts.push({id:'spirit', label:'精霊（攻撃力+10%・威圧所持時のみ）', key:'spiritCount', mode:'count'});
    }
    settings.atkSkills.forEach(function(s){
      opts.push({id:'atk:'+s.id, label:s.name+`（攻撃力+${s.pct}%）`, skillId:s.id, mode:'atk'});
    });
    (settings.otherSkills||[]).forEach(function(s){
      const g = (s.group && String(s.group).trim()) ? String(s.group).trim() : '個別';
      opts.push({id:'other:'+s.id, label:s.name+`（${g}グループ、+${s.pct}%）`, skillId:s.id, mode:'other'});
    });
    return opts;
  }
  function applyCandidate(b, cand){
    const nb = Object.assign({}, b, {
      atkSkillCounts: Object.assign({}, b.atkSkillCounts||{}),
      otherSkillCounts: Object.assign({}, b.otherSkillCounts||{})
    });
    if(!cand || cand.mode==='none') return nb;
    if(cand.mode==='count'){ nb[cand.key] = (Number(nb[cand.key])||0) + 1; }
    else if(cand.mode==='toggle'){ nb[cand.key] = true; }
    else if(cand.mode==='atk'){ nb.atkSkillCounts[cand.skillId] = (Number(nb.atkSkillCounts[cand.skillId])||0) + 1; }
    else if(cand.mode==='other'){
      const skill = (settings.otherSkills||[]).find(s=>s.id===cand.skillId);
      if(skill && skill.unique){ nb.otherSkillCounts[cand.skillId] = 1; }
      else { nb.otherSkillCounts[cand.skillId] = (Number(nb.otherSkillCounts[cand.skillId])||0) + 1; }
    }
    return nb;
  }
  function compareChoice(b){
    const opts = getCandidateOptions();
    const candA = opts.find(o=>o.id===b.compareCandA) || opts[0];
    const candB = opts.find(o=>o.id===b.compareCandB) || opts[0];
    const cur = calcPower(b);
    const powerA = calcPower(applyCandidate(b, candA));
    const powerB = calcPower(applyCandidate(b, candB));
    const gainA = cur.damage>0 ? (powerA.damage-cur.damage)/cur.damage*100 : 0;
    const gainB = cur.damage>0 ? (powerB.damage-cur.damage)/cur.damage*100 : 0;
    let winner = 'even';
    if(Math.abs(gainA-gainB) > 0.001){ winner = gainA>gainB ? 'a' : 'b'; }
    return {cur, candA, candB, powerA, powerB, gainA, gainB, winner};
  }
  function fmtNum(n, digits){
    digits = digits==null?1:digits;
    return Number(n).toFixed(digits).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');
  }
  // 900000→900K、1000000→1M のようなK/M表記。小数第3位以下は四捨五入して小数第2位まで表示。
  function fmtCompact(n){
    n = Number(n)||0;
    const neg = n < 0;
    const abs = Math.abs(n);
    let divisor = 1, suffix = '';
    if(abs >= 1e6){ divisor = 1e6; suffix = 'M'; }
    else if(abs >= 1e3){ divisor = 1e3; suffix = 'K'; }
    const scaled = abs / divisor;
    const rounded = Math.round(scaled * 100) / 100; // 小数第3位四捨五入
    let str = rounded.toFixed(2);
    if(str.indexOf('.')!==-1){
      str = str.replace(/0+$/,'').replace(/\.$/,'');
    }
    if(str==='') str = '0';
    return (neg?'-':'') + str + suffix;
  }

  // シミュレーションの「詳細表示」：実際に使われた数値を代入した式をそのまま見せる。
  function simDetailHtml(r, b, dps, seconds, damage){
    const rows = [];
    if(b.ero){
      const avgAtk = calcEroAvgAtk(r, b);
      const freq = attackFrequencyForEro(b);
      const spd = actualAtkSpeed(b);
      const part1 = avgAtk * freq * spd * ERO_RANGE_DMG_MULT;
      const part2 = r.totalAtk * (r.finalBonus/100) * 0.5 * ERO_RANGE_DMG_MULT * (100/30);
      rows.push(`<div class="at-hint" style="margin-bottom:6px;"><b>エロージョンフィールド取得中のため、専用の式で計算しています。</b></div>`);
      rows.push(`<div class="at-hint" style="margin-bottom:6px;">平均攻撃力（攻撃力up系スキル・取得スキル「その他」も反映）＝ ${fmtCompact(calcEroBaseAtk(r,b))} × 会心期待値${fmtNum(critExpectation(b),3)} ＝ <b>${fmtCompact(avgAtk)}</b></div>`);
      rows.push(`<div class="at-hint" style="margin-bottom:6px;">通常攻撃分 ＝ 平均攻撃力 × 実質攻撃頻度 × 実攻撃速度 × 範囲内被ダメ倍率<br>
        ＝ ${fmtCompact(avgAtk)} × ${fmtNum(freq,3)} × ${fmtNum(spd,3)} × ${ERO_RANGE_DMG_MULT}<br>
        ＝ <b>${fmtCompact(part1)}</b>／秒</div>`);
      rows.push(`<div class="at-hint" style="margin-bottom:6px;">DoT分 ＝ 総攻撃力 × 最終ダメボーナス/100 × 0.5 × 範囲内被ダメ倍率 × 100/30<br>
        ＝ ${fmtCompact(r.totalAtk)} × ${fmtNum(r.finalBonus/100,3)} × 0.5 × ${ERO_RANGE_DMG_MULT} × ${fmtNum(100/30,3)}<br>
        ＝ <b>${fmtCompact(part2)}</b>／秒</div>`);
      rows.push(`<div class="at-hint" style="margin-bottom:6px;">DPS（1秒あたりのダメージ） ＝ 通常攻撃分 + DoT分 ＝ ${fmtCompact(part1)} + ${fmtCompact(part2)} ＝ <b>${fmtCompact(dps)}</b></div>`);
    } else {

    const simSecondsInputVal = (simSecondsRaw===null || simSecondsRaw===undefined || simSecondsRaw==='') ? defaultSimSeconds : simSecondsRaw;
    const simSeconds = Number(simSecondsInputVal)||0;
    const simDamage = withSkillDPS * simSeconds;
    const cmp = compareChoice(build);
    const candOpts = getCandidateOptions();

  function infoModal(){
    if(!state.infoOpen) return '';
    const total = mainWeaponSkillCount(build);
    const correction = mainWeaponSkillCorrection(build);
    const appliedCorrection = appliedMainWeaponSkillCorrection(build);
    const eroFreq = attackFrequencyForEro(build);
    const eroRes = calcPower(build);
    const eroAvgAtk = calcEroAvgAtk(eroRes, build);
    const eroAtkUpSkillRatio = eroRes.atkUp / calcBaseAtkUpMult(build);
    const eroPart1 = eroAvgAtk * eroFreq * actualAtkSpeed(build) * ERO_RANGE_DMG_MULT * eroAtkUpSkillRatio;
    const eroPart2 = eroRes.totalAtk * (eroRes.finalBonus/100) * 0.5 * ERO_RANGE_DMG_MULT * (100/30) * eroAtkUpSkillRatio;
    const eroDPSVal = eroPart1 + eroPart2;
    return `
    <div class="at-modal-backdrop" data-action="closeInfoBackdrop">
      <div class="at-modal">
        <div class="at-modal-head">
          <div class="at-modal-title">📐 計算式ガイド</div>

          <div class="at-hint" style="margin-bottom:6px;">実攻撃速度 ＝ 基本攻撃速度（現在${fmtNum(getBaseAtkSpeed(),3)}発/秒・⚙️詳細設定で編集可能）×（1 + 攻撃速度ボーナス÷100）</div>
          <div class="at-hint" style="margin-bottom:6px;">会心期待値 ＝（1－会心率）＋ 会心率 × 会心ダメージ倍率</div>
          <div class="at-hint" style="margin-bottom:0;">会心なし基本攻撃力 ＝ 総攻撃力 ×（攻撃力up÷100）×（主武器ダメup÷100）×（被ダメup÷100）×（〇〇敵ダメup÷100）×（その他÷100）×（最終ダメボーナス÷100）／会心時攻撃力 ＝ 会心なし基本攻撃力 × 会心ダメージ倍率／平均攻撃力 ＝ 会心なし基本攻撃力 × 会心期待値<br>※この3つは📚基本情報📚のみを反映し、📖取得スキルパネル側の内容は含みません。</div>
        </div>

        <div class="at-subbox" style="margin-bottom:12px;">
          <div class="at-subbox-title">📊 計算結果</div>
          <div class="at-hint" style="margin-bottom:6px;">取得スキルなしDPS／取得スキルありDPS ＝ 総攻撃力 × 矢の本数 ×（攻撃力up÷100）×（主武器ダメup÷100）×（被ダメup÷100）×（〇〇敵ダメup÷100）×（その他÷100）×（最終ダメボーナス÷100）×（未会心率＋会心率×会心倍率）× 基本攻撃速度 × 攻撃速度upボーナス</div>
          <div class="at-hint" style="margin-bottom:6px;">「なし」は📚基本情報📚のみ、「あり」は📚基本情報📚＋📖取得スキルの両方を反映した値です。</div>
          <div class="at-hint" style="margin-bottom:0;">取得スキルなし比 ＝ 現在のダメージ量 ÷「取得スキル」パネルの各項目を未取得にした場合のダメージ量</div>
          <div class="at-hint" style="margin-top:6px;">※エロージョンフィールド取得中は、上記の式の代わりに下記「💥エロージョンフィールド」の専用式でDPSが計算されます。</div>

          </div>
          <div class="at-hint" style="margin-bottom:8px;">
            ※エロージョンフィールド取得中は、フロントアロー・追跡の目の矢数・主武器ダメup%・この特殊補正はいずれも計算結果に適用されません。
          </div>
          <div class="at-hint">
            現在のビルドでの主武器アップ系スキル合計取得数：<b>${total}</b>　補正：<b>${correction>=0?'+':''}${correction}%</b>${build.ero?`（エロージョンフィールド取得中のため実際の適用は<b>${appliedCorrection>=0?'+':''}${appliedCorrection}%</b>）`:''}
          </div>
        </div>

        <div class="at-subbox" style="margin-bottom:0;">
          <div class="at-subbox-title">💥 エロージョンフィールド</div>
          <div class="at-hint" style="margin-bottom:8px;">

          <div class="at-hint" style="margin-bottom:8px;">
            1秒あたりのダメージ ＝<br>
            { 会心なし基本攻撃力 ×（未会心率＋会心率×会心倍率）× 実質攻撃頻度 × 基本攻撃速度 × 攻撃速度アップボーナス × 範囲内被ダメ倍率<br>
            ＋ 総攻撃力 × 最終ダメボーナス × 0.5 × 範囲内被ダメ倍率 × 100/30 } × 攻撃力up系スキル倍率
          </div>
          <div class="at-hint" style="margin-bottom:8px;">
            第1項は通常攻撃分（会心なし基本攻撃力×会心期待値＝平均攻撃力を使用）、第2項はフィールド自体のDoT分です。範囲内被ダメ倍率は<b>1.35固定</b>です。基本攻撃速度×攻撃速度アップボーナス＝実攻撃速度と同じ値です。第1項・第2項を合計した後、最後に「攻撃力up系スキル倍率」を掛けます（＝エロージョンフィールド単体の倍率と攻撃力up系スキルの倍率は互いに独立して掛け合わされます）。
          </div>
          <div class="at-hint" style="margin-bottom:8px;">
            ※ここでの「会心なし基本攻撃力」は📊計算結果パネルに表示されている値（📚基本情報📚のみ反映）とは異なり、📖取得スキルのうち<b>取得スキル「その他」</b>を反映したものを使用します（攻撃力up系スキルは、下記の「攻撃力up系スキル倍率」として第1項・第2項の合計に外側からまとめて反映するため、ここには含めません。主武器up系スキル・マルチショットは実質攻撃頻度側で計算済みのためここには含みません）。

          <div class="at-hint">

            エロージョンフィールド取得時の1秒あたりのダメージ：<b>${build.ero?fmtCompact(eroDPSVal):'未取得（取得時に計算されます）'}</b>
          </div>
        </div>

        <div class="at-divider" style="margin-top:16px;"></div>
        <div class="at-caveat" style="margin-top:0;">※DPS・シミュレーションの数値は、放った矢・弾がすべて敵に命中する「全弾ヒット」を前提とした理論値です。実際の命中率やヒット数によって数値は変動します。</div>
      </div>
    </div>`;

    <div class="at-subbox" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div class="at-panel-desc" style="margin-bottom:0;">☁️ プリセットは自動でクラウドに保存され、どの端末・ブラウザで開いても同じ内容が表示されます（全員で共有されます）。</div>
        <div class="at-btn at-btn-ghost" style="padding:6px 12px;font-size:12px;white-space:nowrap;" data-action="cloudRefresh">${cloudBusy?'⏳':'🔄'}</div>
      </div>
      <div class="at-hint" style="margin-top:6px;margin-bottom:0;color:${statusColor};">${statusText}</div>
    </div>`;
  }

  function presetModal(){
    if(!state.presetOpen) return '';
    const canAdd = presets.length < PRESET_SLOT_MAX;
    return `
    <div class="at-modal-backdrop" data-action="closePresetBackdrop">
      <div class="at-modal">
        <div class="at-modal-head">
          <div class="at-modal-title">💾 プリセット</div>
          <div class="at-modal-close" data-action="closePreset">✕</div>
        </div>

        <div class="at-panel-desc" style="margin-bottom:10px;">📚基本情報📚の内容（総攻撃力・最終ダメボーナス・攻撃速度ボーナス・会心率・会心ダメージ倍率・矢の本数・攻撃力up・主武器ダメup（鋭利の矢／アローレイン／虚無の刃）・被ダメup・〇〇敵ダメupなど）をすべて保存できます（現在${presets.length}枠 / 最大${PRESET_SLOT_MAX}枠）。プリセットごとに独立した内容として保存され、反映するとその内容だけに切り替わります。名前をタップすると「反映・編集・削除」を選べます。</div>

        ${presetCloudSection()}

        <div style="display:flex;flex-direction:column;gap:8px;">
          ${presets.map(function(p,i){ return presetSlotHtml(p,i); }).join('')}
        </div>

        <div class="at-btn at-btn-ghost at-btn-full" style="margin-top:10px;${canAdd?'':'opacity:.4;cursor:not-allowed;'}" data-action="presetAddSlot">＋ プリセット枠を追加${canAdd?'':'（上限に達しています）'}</div>
      </div>
    </div>`;
  }

  function render(){
    let body = tabsBar();
    if(state.tab==='arrows') body += arrowsTool();
    else body += fishingTool();

    app.innerHTML = `
      ${header()}
      ${body}
      <div class="at-footer-note">非公式ファン制作ツールです。数値は自己申告のルール・設定に基づく目安であり、公式仕様を保証するものではありません。</div>
    ` + settingsModal() + infoModal() + presetModal() + (toastMsg? `<div class="at-toast">${escapeHtml(toastMsg)}</div>` : '');
  }

  // ---------- events ----------
  document.body.insertAdjacentHTML('afterbegin', `<div class="at-gear" data-action="openSettings" title="詳細設定">⚙️</div>`);
  document.body.insertAdjacentHTML('afterbegin', `<div class="at-info-btn" data-action="openInfo" title="計算式ガイド">📐</div>`);
  document.body.insertAdjacentHTML('afterbegin', `<div class="at-preset-btn" data-action="openPreset" title="プリセット">💾</div>`);

  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.getAttribute('data-action');
    const val = el.getAttribute('data-val');

    if(action==='setTab'){
      const tool = TOOLS.find(t=>t.id===val);
      if(tool && tool.comingSoon){ setTab(val); return; }
      setTab(val);
      return;
    }
    if(action==='toggleBuild'){
      build[val] = !build[val];
      saveBuild();
      render();
      return;
    }
    if(action==='incCount'){
      setCount(val, getCount(val) + 1);
      saveBuild();
      render();
      return;
    }
    if(action==='decCount'){
      setCount(val, Math.max(0, getCount(val) - 1));
      saveBuild();
      render();
      return;
    }
    if(action==='openSettings'){ state.settingsOpen = true; render(); return; }
    if(action==='closeSettings'){ state.settingsOpen = false; render(); return; }
    if(action==='closeSettingsBackdrop'){
      if(e.target===el){ state.settingsOpen = false; render(); }
      return;
    }
    if(action==='openInfo'){ state.infoOpen = true; render(); return; }
    if(action==='closeInfo'){ state.infoOpen = false; render(); return; }
    if(action==='closeInfoBackdrop'){
      if(e.target===el){ state.infoOpen = false; render(); }
      return;
    }
    if(action==='openPreset'){ state.presetOpen = true; render(); return; }
    if(action==='closePreset'){
      state.presetOpen = false;
      state.presetEditIdx = null;
      state.presetActionIdx = null;
      state.presetRenameIdx = null;
      render();
      return;
    }
    if(action==='closePresetBackdrop'){
      if(e.target===el){
        state.presetOpen = false;
        state.presetEditIdx = null;
        state.presetActionIdx = null;
        state.presetRenameIdx = null;
        render();
      }
      return;
    }
    if(action==='presetToggleMenu'){
      const idx = Number(el.getAttribute('data-idx'));
      state.presetActionIdx = (state.presetActionIdx===idx) ? null : idx;
      render();
      return;
    }
    if(action==='presetEdit'){
      const idx = Number(el.getAttribute('data-idx'));
      state.presetEditIdx = idx;
      state.presetActionIdx = null;
      render();
      return;
    }
    if(action==='presetCancelEdit'){
      state.presetEditIdx = null;
      render();
      return;
    }
    if(action==='presetConfirmSave'){
      const idx = Number(el.getAttribute('data-idx'));
      const input = document.querySelector('[data-preset-name-input="'+idx+'"]');
      const typed = input ? input.value.trim() : '';
      const name = typed || ('プリセット'+(idx+1));
      presets[idx] = { name: name, data: snapshotPresetData(build) };
      savePresets();
      state.presetEditIdx = null;
      showToast('プリセット「'+name+'」を保存しました');
      return;
    }
    if(action==='presetApply'){
      const idx = Number(el.getAttribute('data-idx'));
      const p = presets[idx];
      if(p){
        applyPresetData(build, p.data);
        saveBuild();
        state.presetActionIdx = null;
        showToast('プリセット「'+p.name+'」を反映しました');
      }
      return;
    }
    if(action==='presetUpdateData'){
      const idx = Number(el.getAttribute('data-idx'));
      const p = presets[idx];
      if(p && confirm('プリセット「'+p.name+'」を、現在の入力内容で更新しますか？（名前はそのままです）')){
        presets[idx] = { name: p.name, data: snapshotPresetData(build) };
        savePresets();
        state.presetActionIdx = null;
        showToast('プリセット「'+p.name+'」を現在の内容に更新しました');
      }
      return;
    }
    if(action==='presetRenameStart'){
      const idx = Number(el.getAttribute('data-idx'));
      state.presetRenameIdx = idx;
      state.presetActionIdx = null;
      render();
      return;
    }
    if(action==='presetRenameCancel'){
      state.presetRenameIdx = null;
      render();
      return;
    }
    if(action==='presetRenameConfirm'){
      const idx = Number(el.getAttribute('data-idx'));
      const p = presets[idx];
      if(p){
        const input = document.querySelector('[data-preset-name-input="'+idx+'"]');
        const typed = input ? input.value.trim() : '';
        const name = typed || p.name;
        presets[idx] = { name: name, data: p.data };
        savePresets();
        state.presetRenameIdx = null;
        showToast('プリセット名を「'+name+'」に変更しました');
      }
      return;
    }
    if(action==='presetDelete'){
      const idx = Number(el.getAttribute('data-idx'));
      const p = presets[idx];
      if(p && confirm('プリセット「'+p.name+'」を削除しますか？')){
        presets[idx] = null;
        savePresets();
        state.presetActionIdx = null;
        render();
      }
      return;
    }
    if(action==='presetAddSlot'){
      if(presets.length < PRESET_SLOT_MAX){
        presets.push(null);
        savePresets();
        render();
      } else {
        showToast('プリセット枠は最大'+PRESET_SLOT_MAX+'件までです');
      }
      return;
    }
    if(action==='presetRemoveSlot'){
      const idx = Number(el.getAttribute('data-idx'));
      if(presets.length > PRESET_SLOT_MIN && !presets[idx]){
        presets.splice(idx, 1);
        savePresets();
        render();
      }
      return;
    }
    if(action==='cloudRefresh'){
      cloudPull();
      return;
    }
    if(action==='resetSimSeconds'){
      build.simSeconds = null;
      saveBuild();
      render();
      return;
    }
    if(action==='setSimSeconds30'){
      build.simSeconds = 30;
      saveBuild();
      render();
      return;
    }
    if(action==='toggleSimDetail'){
      state.simDetailOpen = !state.simDetailOpen;
      render();
      return;
    }
    if(action==='setAtkMode'){
      build.atkInputMode = val;
      saveBuild();
      render();
      return;
    }
    if(action==='removeOtherDmgCat'){
      build[val+'On'] = false;
      saveBuild();
      render();
      return;
    }
    if(action==='addAtkSkill'){
      settings.atkSkills.push({id:uid(), name:'新しいスキル', pct:0});
      saveSettings();
      render();
      return;
    }
    if(action==='delAtkSkill'){
      const target = settings.atkSkills.find(s=>s.id===val);
      if(target && target.locked){ return; }
      settings.atkSkills = settings.atkSkills.filter(s=>s.id!==val);
      if(build.atkSkillCounts) delete build.atkSkillCounts[val];
      saveSettings();
      saveBuild();
      render();
      return;
    }
    if(action==='toggleOtherSkill'){
      setCount('other:'+val, getCount('other:'+val) > 0 ? 0 : 1);
      saveBuild();
      render();
      return;
    }
    if(action==='addOtherSkill'){
      if(!settings.otherSkills) settings.otherSkills = [];
      settings.otherSkills.push({id:uid(), name:'新しいスキル', group:'', pct:0, unique:false});
      saveSettings();
      render();
      return;
    }
    if(action==='delOtherSkill'){
      settings.otherSkills = (settings.otherSkills||[]).filter(s=>s.id!==val);
      if(build.otherSkillCounts) delete build.otherSkillCounts[val];
      saveSettings();
      saveBuild();
      render();
      return;
    }
    if(action==='resetSettings'){
      if(confirm('基本攻撃速度・攻撃力up系スキル・その他スキルの設定をすべて初期状態に戻します。よろしいですか？')){
        settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        saveSettings();
        showToast('設定をリセットしました');
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    const addCat = e.target.getAttribute('data-add-other-cat');
    if(addCat){
      const key = e.target.value;
      if(key){
        build[key+'On'] = true;
        saveBuild();
      }
      render();
      return;
    }
    const bind = e.target.getAttribute('data-bind');
    if(bind){
      let v = e.target.value;
      if(e.target.type==='number') v = v===''? '' : Number(v);
      build[bind] = v;
      saveBuild();
      render();
      return;
    }
    const baseAtkSpeed = e.target.getAttribute('data-base-atk-speed');
    if(baseAtkSpeed){
      const v = Number(e.target.value);
      settings.baseAtkSpeed = (v>0) ? v : DEFAULT_BASE_ATK_SPEED;
      saveSettings();
      render();
      return;
    }
    const atkPct = e.target.getAttribute('data-atk-pct');
    if(atkPct){
      const skill = settings.atkSkills.find(s=>s.id===atkPct);
      if(skill && !skill.locked){ skill.pct = Number(e.target.value)||0; saveSettings(); render(); }
      return;
    }
    const atkName = e.target.getAttribute('data-atk-name');
    if(atkName){
      const skill = settings.atkSkills.find(s=>s.id===atkName);
      if(skill){ skill.name = e.target.value; saveSettings(); render(); }
      return;
    }
    const otherPct = e.target.getAttribute('data-other-pct');
    if(otherPct){
      const skill = (settings.otherSkills||[]).find(s=>s.id===otherPct);
      if(skill){ skill.pct = Number(e.target.value)||0; saveSettings(); render(); }
      return;
    }
    const otherName = e.target.getAttribute('data-other-name');
    if(otherName){
      const skill = (settings.otherSkills||[]).find(s=>s.id===otherName);
      if(skill){ skill.name = e.target.value; saveSettings(); render(); }
      return;
    }
    const otherGroup = e.target.getAttribute('data-other-group');
    if(otherGroup){
      const skill = (settings.otherSkills||[]).find(s=>s.id===otherGroup);
      if(skill){ skill.group = e.target.value; saveSettings(); render(); }
      return;
    }
    const otherUnique = e.target.getAttribute('data-other-unique');
    if(otherUnique){
      const skill = (settings.otherSkills||[]).find(s=>s.id===otherUnique);
      if(skill){
        skill.unique = e.target.checked;
        if(skill.unique && getCount('other:'+otherUnique) > 1){ setCount('other:'+otherUnique, 1); saveBuild(); }
        saveSettings();
        render();
      }
      return;
    }
  });

  document.addEventListener('input', function(e){
    // live-update number inputs bound via data-bind while typing
    const bind = e.target.getAttribute('data-bind');
    if(bind && e.target.type==='number'){
      let v = e.target.value===''? '' : Number(e.target.value);
      build[bind] = v;
      saveBuild();
      // re-render but keep focus: only update computed sections lightly by full render
      // (simple approach: skip re-render on every keystroke for number fields to avoid focus loss)
    }
  });

  render();
})();
</script>

</body>
</html>
